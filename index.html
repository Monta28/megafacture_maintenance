<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MegaFacture - Site en maintenance</title>
  <meta name="description" content="MegaFacture est actuellement en maintenance. Nous serons de retour très bientôt !">
  <link rel="icon" href="/images/megafacture-logo.png" type="image/png">

  <!-- Remix Icons -->
  <link href="https://cdn.jsdelivr.net/npm/remixicon@4.2.0/fonts/remixicon.css" rel="stylesheet">

  <style>
    :root {
      /* MegaFacture Brand Colors */
      --megafacture-primary: #0078D4;
      --megafacture-primary-dark: #005A9E;
      --megafacture-primary-light: #2B88D8;
      --megafacture-secondary: #003D6B;
      --megafacture-accent: #FF6B35;
      --megafacture-accent-dark: #E5501B;
      --megafacture-accent-light: #FF8659;
      --megafacture-cyan: #00B7C3;
      --megafacture-navy: #1B3B5F;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      min-height: 100vh;
      background: linear-gradient(135deg,
        rgba(0, 120, 212, 0.05) 0%,
        rgba(255, 107, 53, 0.05) 50%,
        rgba(0, 183, 195, 0.05) 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      overflow: hidden;
    }

    /* Animated background elements */
    .bg-element {
      position: absolute;
      border-radius: 50%;
      filter: blur(60px);
      animation: pulse 4s ease-in-out infinite;
    }

    .bg-element-1 {
      top: -160px;
      right: -160px;
      width: 320px;
      height: 320px;
      background: linear-gradient(135deg, rgba(0, 120, 212, 0.2), rgba(255, 107, 53, 0.2));
    }

    .bg-element-2 {
      bottom: -160px;
      left: -160px;
      width: 320px;
      height: 320px;
      background: linear-gradient(135deg, rgba(255, 107, 53, 0.2), rgba(0, 183, 195, 0.2));
      animation-delay: 2s;
    }

    @keyframes pulse {
      0%, 100% { opacity: 0.5; transform: scale(1); }
      50% { opacity: 0.8; transform: scale(1.05); }
    }

    /* Floating particles */
    .particle {
      position: absolute;
      border-radius: 50%;
      animation: bounce 2s ease-in-out infinite;
    }

    .particle-1 { top: 80px; left: 80px; width: 16px; height: 16px; background: rgba(0, 120, 212, 0.25); }
    .particle-2 { top: 160px; right: 128px; width: 12px; height: 12px; background: rgba(255, 107, 53, 0.25); animation-delay: 0.3s; }
    .particle-3 { bottom: 160px; left: 128px; width: 20px; height: 20px; background: rgba(0, 183, 195, 0.25); animation-delay: 0.7s; }
    .particle-4 { top: 240px; right: 80px; width: 16px; height: 16px; background: rgba(255, 107, 53, 0.2); animation-delay: 0.5s; }
    .particle-5 { bottom: 240px; right: 160px; width: 12px; height: 12px; background: rgba(0, 120, 212, 0.2); animation-delay: 0.2s; }

    @keyframes bounce {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-20px); }
    }

    /* Main content */
    .container {
      position: relative;
      z-index: 10;
      text-align: center;
      padding: 24px;
      max-width: 640px;
      margin: 0 auto;
    }

    /* Logo */
    .logo-container {
      margin-bottom: 32px;
    }

    .logo {
      width: 180px;
      height: auto;
      filter: drop-shadow(0 10px 25px rgba(0, 0, 0, 0.1));
    }

    /* Card */
    .card {
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(10px);
      border-radius: 24px;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.15);
      padding: 48px;
      border: 1px solid rgba(0, 120, 212, 0.1);
    }

    @media (max-width: 640px) {
      .card {
        padding: 32px 24px;
      }
    }

    /* Icon */
    .icon-container {
      margin-bottom: 24px;
    }

    .icon-box {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 80px;
      height: 80px;
      background: linear-gradient(135deg, var(--megafacture-primary), var(--megafacture-accent));
      border-radius: 16px;
      box-shadow: 0 10px 25px rgba(255, 107, 53, 0.3);
    }

    .icon-box i {
      font-size: 36px;
      color: white;
    }

    /* Title */
    h1 {
      font-size: 2rem;
      font-weight: 700;
      color: var(--megafacture-navy);
      margin-bottom: 16px;
    }

    @media (min-width: 640px) {
      h1 {
        font-size: 2.5rem;
      }
    }

    .gradient-text {
      background: linear-gradient(90deg, var(--megafacture-accent), var(--megafacture-accent-dark));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    /* Description */
    .description {
      font-size: 1.125rem;
      color: #4B5563;
      margin-bottom: 32px;
      line-height: 1.75;
    }

    /* Progress indicator */
    .progress-container {
      margin-bottom: 32px;
    }

    .dots {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      margin-bottom: 12px;
    }

    .dot {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      animation: bounce 1s ease-in-out infinite;
    }

    .dot-1 { background: var(--megafacture-primary); }
    .dot-2 { background: var(--megafacture-accent); animation-delay: 0.1s; }
    .dot-3 { background: var(--megafacture-cyan); animation-delay: 0.2s; }

    .progress-text {
      font-size: 0.875rem;
      color: #6B7280;
    }

    /* Contact box */
    .contact-box {
      background: linear-gradient(90deg, rgba(0, 120, 212, 0.08), rgba(255, 107, 53, 0.08));
      border-radius: 16px;
      padding: 24px;
      border: 1px solid rgba(255, 107, 53, 0.15);
    }

    .contact-text {
      color: #374151;
      margin-bottom: 12px;
    }

    .contact-text i {
      margin-right: 8px;
      color: var(--megafacture-accent);
    }

    .contact-link {
      display: inline-flex;
      align-items: center;
      color: var(--megafacture-primary);
      text-decoration: none;
      font-weight: 500;
      transition: color 0.2s;
    }

    .contact-link:hover {
      color: var(--megafacture-accent);
    }

    .contact-link i {
      margin-right: 8px;
    }

    /* Footer text */
    .footer-text {
      margin-top: 32px;
      font-size: 0.875rem;
      color: #6B7280;
    }

    /* Wave decoration */
    .wave-container {
      position: absolute;
      bottom: 0;
      left: 0;
      width: 100%;
    }

    .wave-container svg {
      width: 100%;
      height: 64px;
      opacity: 0.5;
    }
  </style>
</head>
<body>
  <!-- Animated background elements -->
  <div class="bg-element bg-element-1"></div>
  <div class="bg-element bg-element-2"></div>

  <!-- Floating particles -->
  <div class="particle particle-1"></div>
  <div class="particle particle-2"></div>
  <div class="particle particle-3"></div>
  <div class="particle particle-4"></div>
  <div class="particle particle-5"></div>

  <!-- Main content -->
  <div class="container">
    <!-- Logo -->
    <div class="logo-container">
      <img src="/images/megafacture-logo.png" alt="MegaFacture" class="logo">
    </div>

    <!-- Card -->
    <div class="card">
      <!-- Icon -->
      <div class="icon-container">
        <div class="icon-box">
          <i class="ri-tools-line"></i>
        </div>
      </div>

      <!-- Title -->
      <h1>
        Site en <span class="gradient-text">maintenance</span>
      </h1>

      <!-- Description -->
      <p class="description">
        Nous effectuons actuellement des travaux d'amélioration pour vous offrir une meilleure expérience. Nous serons de retour très bientôt !
      </p>

      <!-- Progress indicator -->
      <div class="progress-container">
        <div class="dots">
          <div class="dot dot-1"></div>
          <div class="dot dot-2"></div>
          <div class="dot dot-3"></div>
        </div>
        <p class="progress-text">Maintenance en cours...</p>
      </div>

      <!-- Contact info -->
      <div class="contact-box">
        <p class="contact-text">
          <i class="ri-mail-line"></i>
          Pour toute urgence, contactez-nous :
        </p>
        <a href="mailto:support@megafacture.tn" class="contact-link">
          <i class="ri-mail-send-line"></i>
          support@megafacture.tn
        </a>
      </div>
    </div>

    <!-- Footer text -->
    <p class="footer-text">
      Merci pour votre patience et votre compréhension.
    </p>
  </div>

  <!-- Decorative wave at bottom -->
  <div class="wave-container">
    <svg viewBox="0 0 1200 120" fill="none">
      <path d="M0,60 C200,120 400,0 600,60 C800,120 1000,0 1200,60 L1200,120 L0,120 Z" fill="white"/>
    </svg>
  </div>
</body>
</html>
